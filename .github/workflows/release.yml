name: Release

on:
  push:
    tags:
      - 'v*'

# Pinned tool versions keep the gate reproducible. Bump deliberately; avoid
# @latest so a upstream release cannot silently break a tag publish.
env:
  MAGE_VERSION: 'v1.17.2'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  GOVULNCHECK_VERSION: 'v1.6.0'

jobs:
  verify:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install ALSA dev headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install mage
        run: go install github.com/magefile/mage@${{ env.MAGE_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Verify (tests, lint, vet, vulnerability)
        run: mage verify

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-slim
            goos: linux
            goarch: amd64
            artifact: tuta-linux-amd64
            upx: true
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            artifact: tuta-linux-arm64
            upx: true
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: tuta-darwin-arm64
            upx: false
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: tuta-windows-amd64.exe
            upx: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install ALSA dev headers (Linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install mage
        run: go install github.com/magefile/mage@${{ env.MAGE_VERSION }}

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: mage build

      - name: Stage artifact
        shell: bash
        run: |
          src="build/tuta"
          if [ -f "build/tuta.exe" ]; then src="build/tuta.exe"; fi
          mv "$src" "${{ matrix.artifact }}"

      - name: Compress with UPX
        if: matrix.upx
        uses: crazy-max/ghaction-upx@v4
        with:
          files: ./${{ matrix.artifact }}
          args: --best --lzma

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
